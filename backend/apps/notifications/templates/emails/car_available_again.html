<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A vehicle you bid on is available again</title>
</head>
<body style="margin:0; padding:0; background-color:#FAFAFA;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#FAFAFA;">
  <tr><td align="center" style="padding:32px 12px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; max-width:600px;">
      <tr><td align="left" style="padding:8px 8px 20px 8px;">
        <img src="{{ logo_url }}" alt="Buy &amp; Rent Cars" width="98" height="36" style="display:block; border:0;" />
      </td></tr>
      <tr><td style="background-color:#FFFFFF; border:1px solid #E8E9E9; border-radius:16px; padding:40px 44px; font-family:Arial,Helvetica,sans-serif;">
        <h1 style="margin:0 0 10px 0; font-size:24px; color:#121212;">It's back on the market</h1>
        <p style="margin:0 0 20px 0; font-size:16px; line-height:1.55; color:#4B4C4E;">
          <strong style="color:#121212;">{{ car_title }}</strong> is available again. If you're still interested, make a new offer.
        </p>
        <a href="{{ action_url }}" style="display:inline-block; background-color:#00008B; font-size:16px; font-weight:bold; color:#FFFFFF; text-decoration:none; padding:15px 40px; border-radius:8px;">View the car</a>
      </td></tr>
      <tr><td style="padding:24px 44px 12px 44px; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.6; color:#97989A;">
        Buy &amp; Rent Cars &middot; Lagos, Nigeria
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
